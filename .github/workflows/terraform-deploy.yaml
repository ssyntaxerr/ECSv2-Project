name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_PAGER: ""
  TF_VAR_base_url: https://sufyanokomi.co.uk
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  ECR_API_REPOSITORY: ecs-v2-dev-api-repo
  ECR_WORKER_REPOSITORY: ecs-v2-dev-worker-repo
  ECR_DASHBOARD_REPOSITORY: ecs-v2-dev-dashboard-repo

jobs:
  terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ECSv2-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Get current image tag
        id: image-tag
        run: |
          IMAGE_TAG=$(aws ssm get-parameter \
            --name "/ecs-v2/dev/current-image-tag" \
            --query "Parameter.Value" \
            --output text \
            --region $AWS_REGION)

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether images exist
        id: image-check
        working-directory: .
        run: |
          API_IMAGE_COUNT=$(aws ecr batch-get-image \
            --repository-name "$ECR_API_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'length(images)' \
            --output text)

          WORKER_IMAGE_COUNT=$(aws ecr batch-get-image \
            --repository-name "$ECR_WORKER_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'length(images)' \
            --output text)

          DASHBOARD_IMAGE_COUNT=$(aws ecr batch-get-image \
            --repository-name "$ECR_DASHBOARD_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'length(images)' \
            --output text)

          if [ "$API_IMAGE_COUNT" -gt 0 ]; then
            echo "api_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$WORKER_IMAGE_COUNT" -gt 0 ]; then
            echo "worker_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$DASHBOARD_IMAGE_COUNT" -gt 0 ]; then
            echo "dashboard_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashboard_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API image
        if: steps.image-check.outputs.api_exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: .
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG" \
            ./app

          docker push \
            "$ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG"

      - name: Build and push Worker image
        if: steps.image-check.outputs.worker_exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: .
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG" \
            ./services/worker

          docker push \
            "$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG"

      - name: Build and push Dashboard image
        if: steps.image-check.outputs.dashboard_exists != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: .
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_DASHBOARD_REPOSITORY:$IMAGE_TAG" \
            ./services/dashboard

          docker push \
            "$ECR_REGISTRY/$ECR_DASHBOARD_REPOSITORY:$IMAGE_TAG"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan